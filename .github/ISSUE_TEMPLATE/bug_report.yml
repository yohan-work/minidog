name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose --profile demo up -d
        2. Open Services → api
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag (`docker compose images` shows it) or the commit you built from.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run minidog
      options:
        - Docker Compose (deploy/compose.yaml)
        - From source (pnpm dev)
        - Always-on mode (pnpm local:up)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 on Apple silicon, Docker Desktop 4.40
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs api web` or the terminal running pnpm dev. Remove anything private."
      render: shell
