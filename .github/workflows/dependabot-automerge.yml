name: Dependabot auto-merge

# Runs after CI finishes so a merge only happens on a green pull request.
# main has no protection rules, so gh pr merge --auto would land immediately;
# keying off workflow_run is what makes the CI gate real.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge green minor and patch updates
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # The pull request has to still point at the commit CI just validated.
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
            --json number,headRefOid,author \
            --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\" and .author.login == \"app/dependabot\")] | first | .number // empty")
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request at $HEAD_SHA on $HEAD_BRANCH."
            exit 0
          fi

          # Dependabot records the semver step per dependency in the commit message.
          if gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message \
            | grep -q 'version-update:semver-major'; then
            echo "#$pr carries a major update; leaving it for review."
            exit 0
          fi

          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
