# Please see the Dependabot docs for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # Major jumps are reviewed by hand; minors and patches arrive weekly.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minors and patches ride in one pull request and auto-merge once CI is
      # green; majors still arrive one by one so they can be read.
      actions:
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
