name: minidog

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: minidog
      CLICKHOUSE_USER: minidog
      CLICKHOUSE_PASSWORD: minidog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/config.d/minidog.xml:/etc/clickhouse-server/config.d/minidog.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    # Reported as host.name for the host metrics this collector scrapes.
    hostname: ${MINIDOG_HOST_NAME:-docker-host}
    environment:
      # The API runs on the host (pnpm dev), outside this compose project.
      MINIDOG_INGEST_ENDPOINT: ${MINIDOG_INGEST_ENDPOINT:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    restart: unless-stopped

volumes:
  clickhouse-data:
